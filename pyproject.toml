[project]
name = "comfyui-h3-camera-editor"
description = "Planejador visual de camera para o MiniMax H3: orbita, elevacao, altura, travelling lateral, distancia e keyframes compilados em prompts, com saidas para H3 Edit, para o caminho nativo do H3 e Depth Warp no formato do Viggle Meridian, com conversor de pesos do Meridian para o ComfyUI."
version = "33.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
keywords = [
    "bruxosdovfx",
    "bruxos-do-vfx",
    "minimax",
    "h3",
    "camera",
    "orbit",
    "video",
    "depth-warp",
    "meridian",
]

[project.urls]
Repository = "https://github.com/bruxosdovfx/ComfyUI-H3-Camera-Editor"

[tool.comfy]
PublisherId = "bruxosdovfx"
DisplayName = "Camera H3 Bruxos"
Icon = "https://raw.githubusercontent.com/bruxosdovfx/ComfyUI-H3-Camera-Editor/main/web/logo.png"
includes = []
