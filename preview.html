<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera H3 da Bruxos do VFX — prévia</title>
<style>body{background:#101016;color:#eee;font:15px system-ui;max-width:820px;margin:30px auto;padding:16px}h1{font-size:24px}textarea{box-sizing:border-box;width:100%;height:130px;background:#202027;color:#eee;padding:12px;border:1px solid #555;border-radius:8px}p{color:#aaa;line-height:1.5}</style>
<h1>Camera H3 da Bruxos do VFX</h1><p>Prévia do controle local. Selecione um keyframe e arraste no painel. Fora do ComfyUI não há node de imagem para ligar, então use o botão de imagem de referência. Esta página não executa o modelo.</p><main></main><p>Trajetória salva pelo node:</p><textarea aria-label="Trajetória JSON"></textarea>
<script type="module">
import {createCameraEditor} from './web/panel.js';
const input=document.querySelector('textarea');input.value=JSON.stringify([{time:0,azimuth:0,elevation:0,distance:1},{time:.5,azimuth:45,elevation:10,distance:1},{time:1,azimuth:90,elevation:0,distance:.8}]);
let frames=124;
const editor=createCameraEditor({read:()=>input.value,write:v=>input.value=v,duration:()=>(frames-1)/24,interpolation:()=> 'smooth',setDuration:n=>frames=n});
document.querySelector('main').append(editor.element);input.addEventListener('change',editor.sync);
</script></html>
